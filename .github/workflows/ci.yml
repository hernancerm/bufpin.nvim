name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:

  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6.0.2
      - name: Install Mise, Neovim and tools
        # https://github.com/jdx/mise-action
        uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [tools]
            neovim = "0.12.0"
            stylua = "2.4.0"
      - name: Check formatting
        run: make testfmt
      - name: Check docs are up to date
        run: make testdocs
      - name: Run tests
        run: make test
